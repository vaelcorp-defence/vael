[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vael"
version = "0.0.1"
description = "Autonomous web application vulnerability research agent by Vaelcorp Defence"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.42",
    "pytest-asyncio>=0.23",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vael = "vael.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
